<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Weecraft | 2D Sandbox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0f1a; overflow: hidden;
            font-family: 'Minecraft Rus', 'Courier New', monospace; touch-action: none;
        }
        @font-face {
            font-family: 'Minecraft Rus';
            src: url('Minecraft Rus.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        canvas {
            display: block; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: #87CEEB; cursor: crosshair;
        }
        .game-title {
            position: fixed; top: 20px; left: 25px; z-index: 200;
            font-family: 'Minecraft Rus', 'Arial', monospace; font-size: 34px;
            font-weight: normal; color: #ffffff;
            text-shadow: 3px 3px 0 #000000, 2px 2px 8px rgba(0,0,0,0.8);
            pointer-events: none; white-space: nowrap; letter-spacing: 2px;
        }
        .game-title .version { font-size: 14px; color: #aaaaaa; text-shadow: 1px 1px 0 #000; margin-left: 8px; }
        .ui-panel {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px);
            border-radius: 16px; padding: 12px 20px; display: flex;
            flex-wrap: wrap; justify-content: space-between; align-items: center;
            gap: 15px; z-index: 100; border: 2px solid #6a6a6a;
            font-family: 'Minecraft Rus', monospace; pointer-events: auto;
        }
        .hotbar {
            display: flex; gap: 6px; background: #2c2c2c; padding: 8px 12px;
            border-radius: 12px; overflow-x: auto; max-width: 45%;
        }
        .slot {
            width: 55px; height: 55px; background: #3a3a3a; border: 3px solid #5a5a5a;
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
            position: relative;
        }
        .slot.selected { border: 3px solid #ffcc44; background: #4e4e4e; box-shadow: 0 0 0 2px #ffaa33; }
        .slot img { width: 35px; height: 35px; image-rendering: pixelated; }
        .slot span { font-size: 11px; color: white; text-shadow: 1px 1px 0 black; }
        .slot .tool-badge {
            position: absolute; top: 2px; left: 3px; font-size: 10px;
        }
        .slot .tool-tier {
            position: absolute; bottom: 2px; right: 3px; font-size: 8px;
            color: #ffaa44; text-shadow: 1px 1px 0 #000;
        }
        .info {
            background: #1f1f1fe6; padding: 8px 18px; border-radius: 40px;
            color: #ffffaa; font-size: 14px; min-width: 260px; text-align: center;
        }
        .controls-hint {
            background: #000000aa; padding: 6px 14px; border-radius: 30px;
            font-size: 12px; color: #e0e0e0; display: flex; gap: 12px; flex-wrap: wrap;
        }
        .controls-hint kbd { background: #2c2c2c; border-radius: 6px; padding: 2px 6px; color: #ffd966; }
        .build-controls {
            position: fixed; top: 90px; right: 20px; z-index: 150;
            display: flex; flex-direction: column; gap: 8px;
        }
        .build-btn {
            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
            border: 2px solid #6a6a6a; border-radius: 10px;
            padding: 10px 16px; color: white; font-family: 'Minecraft Rus', monospace;
            font-size: 13px; cursor: pointer; transition: all 0.2s;
            text-align: left; min-width: 140px;
        }
        .build-btn:hover { background: rgba(50,50,50,0.9); border-color: #ffcc44; }
        .build-btn .icon { margin-right: 8px; }
        .build-btn.export { border-color: #44cc88; }
        .build-btn.import { border-color: #4488cc; }
        .build-btn.clear { border-color: #cc4444; }
        .build-btn.export:hover { border-color: #66ffaa; }
        .build-btn.import:hover { border-color: #66aaff; }
        .build-btn.clear:hover { border-color: #ff6666; }
        .build-btn.creative { border-color: #cc88ff; }
        .build-btn.creative:hover { border-color: #dd99ff; }
        .build-btn.creative.active { border-color: #ff44ff; background: rgba(80,0,80,0.6); }
        .build-btn.dungeon { border-color: #ff8844; }
        .build-btn.dungeon:hover { border-color: #ffaa66; }
        .crafting-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 300;
            display: flex; align-items: center; justify-content: center; pointer-events: auto;
        }
        .crafting-menu {
            background: #2c2c2c; border: 4px solid #aa8c54; border-radius: 16px;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            font-family: 'Minecraft Rus', monospace; max-width: 90vw; max-height: 90vh; overflow-y: auto;
        }
        .crafting-menu-title {
            color: #e0c896; font-size: 18px; text-align: center; letter-spacing: 1px;
        }
        .crafting-body { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .crafting-grid-3x3 {
            display: grid; grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px); gap: 8px;
            background: #3a3a3a; padding: 12px; border-radius: 8px;
        }
        .crafting-grid-2x2 {
            display: grid; grid-template-columns: repeat(2, 60px);
            grid-template-rows: repeat(2, 60px); gap: 8px;
            background: #3a3a3a; padding: 12px; border-radius: 8px;
        }
        .craft-arrow { font-size: 26px; color: #cfcfcf; }
        .craft-result-slot {
            width: 64px; height: 64px; background: #262626; border: 2px solid #ffcc44;
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }
        .craft-result-slot img { width: 46px; height: 46px; image-rendering: pixelated; }
        .craft-result-slot span { font-size: 11px; color: white; position: absolute; bottom: 2px; right: 5px; }
        .craft-slot {
            background: #1f1f1f; border: 2px solid #6a6a6a; border-radius: 6px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; position: relative;
        }
        .craft-slot img { width: 45px; height: 45px; image-rendering: pixelated; }
        .craft-slot span { font-size: 10px; color: white; position: absolute; bottom: 2px; right: 4px; }
        .craft-close {
            margin-top: 8px; padding: 8px 20px; background: #5a5a5a; border: none;
            color: white; font-family: inherit; cursor: pointer; border-radius: 8px; font-size: 14px;
        }
        .craft-close:hover { background: #7a7a7a; }
        .recipe-hint { color: #aaa; font-size: 12px; text-align: center; white-space: pre-line; }
        .recipe-book {
            display: flex; flex-direction: column; gap: 6px; max-height: 216px; overflow-y: auto;
            background: #232323; padding: 8px; border-radius: 8px; min-width: 170px;
        }
        .recipe-book-item {
            display: flex; align-items: center; gap: 8px; font-size: 11px; color: #ddd;
            background: #2e2e2e; padding: 4px 6px; border-radius: 6px;
        }
        .recipe-book-item img { width: 24px; height: 24px; image-rendering: pixelated; }
        .recipe-book-item .tier-badge {
            font-size: 9px; color: #ffaa44; margin-left: auto;
        }
        .save-indicator {
            position: fixed; top: 80px; right: 25px; z-index: 250;
            background: rgba(30, 120, 60, 0.9); color: white;
            padding: 8px 16px; border-radius: 20px;
            font-family: 'Minecraft Rus', monospace; font-size: 13px;
            opacity: 0; transform: translateY(-10px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .save-indicator.show { opacity: 1; transform: translateY(0); }
        .file-input-hidden { display: none; }
        .build-status {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 10px 24px;
            border-radius: 12px; font-family: 'Minecraft Rus', monospace;
            font-size: 14px; z-index: 160; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; text-align: center; border: 2px solid #6a6a6a;
        }
        .build-status.show { opacity: 1; }
        .build-status.success { border-color: #44cc88; }
        .build-status.error { border-color: #cc4444; }
        .chest-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 300;
            display: flex; align-items: center; justify-content: center; pointer-events: auto;

            background: #2c2c2c; border: 4px solid #8b6b3b; border-radius: 16px;

            color: #e0c896; font-size: 18px; text-align: center; margin-bottom: 15px;
        }

            display: grid; grid-template-columns: repeat(9, 50px);
            grid-template-rows: repeat(3, 50px); gap: 6px;
            background: #3a3a3a; padding: 12px; border-radius: 8px;
            justify-content: center;
        }
        .chest-slot {
            background: #1f1f1f; border: 2px solid #6a6a6a; border-radius: 4px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; position: relative;
            width: 50px; height: 50px;
        }
        .chest-slot img { width: 32px; height: 32px; image-rendering: pixelated; }
        .chest-slot span { font-size: 10px; color: white; position: absolute; bottom: 2px; right: 4px; }
        .chest-close {
            margin-top: 12px; padding: 8px 20px; background: #5a5a5a; border: none;
            color: white; font-family: inherit; cursor: pointer; border-radius: 8px; font-size: 14px;
            display: block; margin-left: auto; margin-right: auto;
        }
        .chest-close:hover { background: #7a7a7a; }
        @media (max-width: 700px) {
            .slot { width: 45px; height: 45px; }
            .slot img { width: 28px; height: 28px; }
            .info { font-size: 12px; min-width: 200px; }
            .game-title { font-size: 24px; top: 12px; left: 15px; }
            .build-controls { top: 80px; right: 10px; }
            .build-btn { padding: 6px 12px; font-size: 11px; min-width: 100px; }
            .chest-grid { grid-template-columns: repeat(9, 35px); grid-template-rows: repeat(3, 35px); }
            .chest-slot { width: 35px; height: 35px; }
            .chest-slot img { width: 24px; height: 24px; }
            .chest-menu { min-width: auto; }
        }
        @media (max-width: 500px) { .controls-hint { display: none; } .hotbar { max-width: 35%; } }

</head>

        function hash(x, seed) {
            let h = (x * 374761393 + seed * 668265263) | 0;
            h = Math.imul(h ^ (h >>> 13), 1274126177);
            return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
        }

        function hash2d(x, y, seed) {
            let h = (x * 374761393 + y * 668265263 + seed * 1274126177) | 0;
            h = Math.imul(h ^ (h >>> 13), 1274126177);
            return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
        }

        function noise1d(x, seed) {
            const xi = Math.floor(x);
            const xf = x - xi;
            const t = xf * xf * (3 - 2 * xf);
            const a = hash(xi, seed);
            const b = hash(xi + 1, seed);
            return a + (b - a) * t;
        }

        function terrainHeight(x) {
            let h = 0;
            h += noise1d(x * 0.02, SEED) * 14;
            h += noise1d(x * 0.05, SEED + 1) * 6;
            h += noise1d(x * 0.12, SEED + 2) * 2.5;
            return Math.floor(25 + h);
        }

        function caveNoise(x, y) {
            const n1 = Math.sin(x * 0.12) * Math.cos(y * 0.12);
            const n2 = Math.sin(x * 0.04 + y * 0.04 + SEED * 0.001) * 0.6;
            return n1 + n2;
        }

        function generateOreVein(chunk, worldX0, worldY0, startX, startY, oreType, oreSize) {
            const visited = new Set();
            const queue = [{x: startX, y: startY}];
            visited.add(`${startX},${startY}`);
            let placed = 0;

            while (queue.length > 0 && placed < oreSize) {
                const idx = Math.floor(Math.random() * queue.length);
                const {x, y} = queue.splice(idx, 1)[0];

                const lx = x - worldX0;
                const ly = y - worldY0;
                if (lx < 0 || lx >= CHUNK_SIZE || ly < 0 || ly >= CHUNK_SIZE) continue;
                if (chunk[ly * CHUNK_SIZE + lx] !== TYPES.STONE) continue;

                chunk[ly * CHUNK_SIZE + lx] = oreType;
                placed++;

                const neighbors = [
                    {x: x+1, y}, {x: x-1, y},
                    {x, y: y+1}, {x, y: y-1}
                ];
                for (const n of neighbors) {
                    const key = `${n.x},${n.y}`;
                    if (!visited.has(key)) {
                        visited.add(key);
                        queue.push(n);
                    }
                }
            }
        }

        function generateChunk(cx, cy) {
            const chunk = new Uint8Array(CHUNK_SIZE * CHUNK_SIZE);
            const worldX0 = cx * CHUNK_SIZE;
            const worldY0 = cy * CHUNK_SIZE;

            for (let lx = 0; lx < CHUNK_SIZE; lx++) {
                const worldX = worldX0 + lx;
                const surfaceY = terrainHeight(worldX);

                for (let ly = 0; ly < CHUNK_SIZE; ly++) {
                    const worldY = worldY0 + ly;
                    let block = TYPES.AIR;

                    if (worldY < surfaceY) {
                        block = TYPES.AIR;
                    } else if (worldY === surfaceY) {
                        block = TYPES.GRASS;
                    } else if (worldY < surfaceY + 4) {
                        block = TYPES.DIRT;
                    } else {
                        const depth = worldY - surfaceY;
                        const r = hash2d(worldX, worldY, SEED + 100);

                        if (depth >= 5 && depth <= 50 && r < 0.15) {
                            block = TYPES.COAL_ORE;
                        }
                        else if (depth >= 5 && depth <= 60 && r < 0.10) {
                            block = TYPES.IRON_ORE;
                        }
                        else if (depth >= 20 && depth <= 60 && r < 0.05) {
                            block = TYPES.GOLD_ORE;
                        }
                        else if (depth >= 20 && depth <= 70 && r < 0.025) {
                            block = TYPES.DIAMOND_ORE;
                        }
                        else if (depth >= 10 && depth <= 70 && r < 0.04) {
                            block = TYPES.REDSTONE_ORE;
                        }
                        else if (depth >= 15 && depth <= 70 && r < 0.03) {
                            block = TYPES.LAPIS_ORE;
                        }
                        else if (depth >= 20 && depth <= 60 && r < 0.008) {
                            block = TYPES.EMERALD_ORE;
                        }
                        else if (depth >= 30 && depth <= 80 && r < 0.02) {
                            block = TYPES.QUARTZ_ORE;
                        }
                        else if (depth >= 40 && depth <= 100 && r < 0.04) {
                            block = TYPES.NATURAL_GAS;
                        }
                        else {
                            block = TYPES.STONE;
                        }

                        if (block === TYPES.STONE && depth > 5) {
                            if (caveNoise(worldX, worldY) > 0.65) block = TYPES.AIR;
                        }
                    }

                    chunk[ly * CHUNK_SIZE + lx] = block;
                }
            }

            // Деревья
            for (let lx = 2; lx < CHUNK_SIZE - 2; lx++) {
                const worldX = worldX0 + lx;
                const surfaceY = terrainHeight(worldX);

                if (surfaceY < worldY0 || surfaceY >= worldY0 + CHUNK_SIZE) continue;

                const treeChance = hash(worldX, SEED + 200);
                if (treeChance < 0.12) {
                    const treeH = 4 + Math.floor(hash(worldX, SEED + 300) * 3);

                    for (let h = 1; h <= treeH; h++) {
                        const wy = surfaceY - h;
                        if (wy >= worldY0 && wy < worldY0 + CHUNK_SIZE) {
                            const ly = wy - worldY0;
                            chunk[ly * CHUNK_SIZE + lx] = TYPES.WOOD;
                        }
                    }

                    const topY = surfaceY - treeH;
                    for (let dy = -2; dy <= 1; dy++) {
                        for (let dx = -2; dx <= 2; dx++) {
                            if (Math.abs(dx) + Math.abs(dy) > 2) continue;
                            const wx = worldX + dx;
                            const wy = topY + dy;
                            if (wx >= worldX0 && wx < worldX0 + CHUNK_SIZE &&
                                wy >= worldY0 && wy < worldY0 + CHUNK_SIZE) {
                                const lx2 = wx - worldX0;
                                const ly2 = wy - worldY0;
                                if (chunk[ly2 * CHUNK_SIZE + lx2] === TYPES.AIR) {
                                    chunk[ly2 * CHUNK_SIZE + lx2] = TYPES.LEAVES;
                                }
                            }
                        }
                    }
                }
            }

            return chunk;
        }

        function ensureChunk(cx, cy) {
            const key = chunkKey(cx, cy);
            if (!chunks.has(key)) {
                chunks.set(key, generateChunk(cx, cy));
            }
        }

        function getOriginalBlock(x, y) {
            const cx = Math.floor(x / CHUNK_SIZE);
            const cy = Math.floor(y / CHUNK_SIZE);
            const chunk = chunks.get(chunkKey(cx, cy));
            if (!chunk) return TYPES.AIR;
            const lx = x - cx * CHUNK_SIZE;
            const ly = y - cy * CHUNK_SIZE;
            return chunk[ly * CHUNK_SIZE + lx];
        }

        function getBlock(x, y) {
            const key = `${x},${y}`;
            if (modifiedBlocks.has(key)) return modifiedBlocks.get(key);
            return getOriginalBlock(x, y);
        }

        function setBlock(x, y, type) {
            const key = `${x},${y}`;
            const original = getOriginalBlock(x, y);

            if (type === original) {
                modifiedBlocks.delete(key);
            } else {
                modifiedBlocks.set(key, type);
            }

            const cx = Math.floor(x / CHUNK_SIZE);
            const cy = Math.floor(y / CHUNK_SIZE);
            const ck = chunkKey(cx, cy);
            if (chunks.has(ck)) {
                const chunk = chunks.get(ck);
                const lx = x - cx * CHUNK_SIZE;
                const ly = y - cy * CHUNK_SIZE;
                chunk[ly * CHUNK_SIZE + lx] = type;
            }
        }

        function updateChunks() {
            const pcx = Math.floor((playerX / TILE_SIZE) / CHUNK_SIZE);
            const pcy = Math.floor((playerY / TILE_SIZE) / CHUNK_SIZE);
            const key = `${pcx},${pcy}`;

            if (key === lastLoadedChunkKey) return;
            lastLoadedChunkKey = key;

            for (let cy = pcy - VIEW_RADIUS; cy <= pcy + VIEW_RADIUS; cy++) {
                for (let cx = pcx - VIEW_RADIUS; cx <= pcx + VIEW_RADIUS; cx++) {
                    ensureChunk(cx, cy);
                }

            for (const [blockKey, type] of modifiedBlocks) {
                const [bx, by] = blockKey.split(',').map(Number);
                const cx = Math.floor(bx / CHUNK_SIZE);
                const cy = Math.floor(by / CHUNK_SIZE);
                const ck = chunkKey(cx, cy);
                if (chunks.has(ck)) {
                    const chunk = chunks.get(ck);
                    const lx = bx - cx * CHUNK_SIZE;
                    const ly = by - cy * CHUNK_SIZE;
                    chunk[ly * CHUNK_SIZE + lx] = type;
                }
            }

            const UNLOAD_DIST = VIEW_RADIUS + 2;
            for (const [k, _] of chunks) {
                const [cx, cy] = k.split(',').map(Number);
                if (Math.abs(cx - pcx) > UNLOAD_DIST || Math.abs(cy - pcy) > UNLOAD_DIST) {
                    chunks.delete(k);
                }
            }
        }

        }

        function removeFromSlot(slotIndex, count) {
            if (slotIndex < 0 || slotIndex >= inventory.length) return;
            inventory[slotIndex].count -= count;
            if (inventory[slotIndex].count <= 0) {
                inventory.splice(slotIndex, 1);
                if (selectedSlot >= inventory.length) {
                    selectedSlot = Math.max(0, inventory.length - 1);
                }
            }
            updateHotbarUI();
        }

        function initWorld() {
            const loaded = loadGame();

            if (!loaded) {
                for (let cy = -VIEW_RADIUS; cy <= VIEW_RADIUS; cy++) {
                    for (let cx = -VIEW_RADIUS; cx <= VIEW_RADIUS; cx++) {
                        ensureChunk(cx, cy);
                    }
                }

                const spawnX = 0;
                let spawnY = 0;
                for (let y = 0; y < 100; y++) {
                    if (getBlock(spawnX, y) !== TYPES.AIR) {
                        spawnY = y;
                        break;
                    }
                }
                playerX = spawnX * TILE_SIZE;
                playerY = (spawnY - 3) * TILE_SIZE;
                
                // Генерируем данж при первом запуске
                generateDungeon(8, 45);
            } else {
                const pcx = Math.floor((playerX / TILE_SIZE) / CHUNK_SIZE);
                const pcy = Math.floor((playerY / TILE_SIZE) / CHUNK_SIZE);
                for (let cy = pcy - VIEW_RADIUS; cy <= pcy + VIEW_RADIUS; cy++) {
                    for (let cx = pcx - VIEW_RADIUS; cx <= pcx + VIEW_RADIUS; cx++) {
                        ensureChunk(cx, cy);
                    }
                }
                // Если данж ещё не был сгенерирован
                if (!dungeonPlaced) {
                    generateDungeon(8, 45);
                }
            }

            regenerateStars();
            updateChunks();
            updateCreativeUI();
        }

        function regenerateStars() {
            stars = [];
            const w = canvas ? canvas.width : window.innerWidth;
            const h = canvas ? canvas.height : window.innerHeight;
            for (let i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h * 0.6,
                    r: 1 + Math.random() * 1.5,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }

        // ===================== ГЕНЕРАЦИЯ ДАНЖА =====================
        function generateDungeon(startX, startY) {
            try {
                const data = DUNGEON_DATA;
                let placed = 0;
                
                for (let row = 0; row < data.height; row++) {
                    for (let col = 0; col < data.width; col++) {
                        const blockData = data.blocks[row][col];
                        if (blockData.type !== TYPES.AIR) {
                            const worldX = startX + col;
                            const worldY = startY + row;
                            setBlock(worldX, worldY, blockData.type);
                            if (blockData.type === TYPES.TRAPDOOR) {
                                trapdoorStates.set(`${worldX},${worldY}`, blockData.trapdoorOpen || false);
                            }
                            placed++;
                        }
                    }
                }
                
                dungeonPlaced = true;
                showBuildStatus(`🏚️ Данж сгенерирован! (${placed} блоков)`, 'success');
                saveGame();
            } catch(e) {
                showBuildStatus(`❌ Ошибка генерации данжа: ${e.message}`, 'error');
            }
        }

        function generateDungeonAtPlayer() {
            const px = Math.floor(playerX / TILE_SIZE);
            const py = Math.floor(playerY / TILE_SIZE);
            // Размещаем данж справа от игрока
            const startX = px + 5;
            const startY = py - 5;
            generateDungeon(startX, startY);
        }

                const pickaxeTypes = [

                    { type: TYPES.STONE, tier: 1, name: "Каменная кирка" },
                    { type: TYPES.IRON_ORE, tier: 2, name: "Железная кирка" },
                    { type: TYPES.DIAMOND_ORE, tier: 3, name: "Алмазная кирка" },
                    { type: TYPES.PLASTIC_BLOCK, tier: 4, name: "Пластиковая кирка" }
                ];
                for (const p of pickaxeTypes) {
                    creativeInventory.push({

                creativeInventory.push({ type: TYPES.IRON_ORE, count: 1, name: "Огниво", isFlint: true });

            } else {

                showBuildStatus('🎨 Творческий режим ВЫКЛЮЧЕН', 'info');
                document.getElementById('creativeBtn').classList.remove('active');
                document.getElementById('creativeBtn').textContent = '🎨 Творческий режим';
            }

            saveGame();

        function updateCreativeUI() {
            const btn = document.getElementById('creativeBtn');
            if (isCreative) {
                btn.classList.add('active');
                btn.textContent = '🎨 Творческий (ВКЛ)';
            } else {
                btn.classList.remove('active');

        // ===================== CHEST SYSTEM =====================
        function getChestKey(x, y) { return `chest_${x}_${y}`; }

        function openChest(x, y) {
            const key = getChestKey(x, y);
            if (!chestContents.has(key)) {
                chestContents.set(key, Array(27).fill(null));
            }
            renderChestMenu(x, y);
        }

        function renderChestMenu(chestX, chestY) {
            let existing = document.querySelector('.chest-overlay');
            if (existing) existing.remove();

            const key = getChestKey(chestX, chestY);
            const contents = chestContents.get(key) || Array(27).fill(null);

            let overlay = document.createElement('div');
            overlay.className = 'chest-overlay';
            let menu = document.createElement('div');
            menu.className = 'chest-menu';

            let title = document.createElement('div');
            title.className = 'chest-title';
            title.innerText = `📦 Сундук (${chestX}, ${chestY})`;
            menu.appendChild(title);

            let grid = document.createElement('div');
            grid.className = 'chest-grid';

            for (let i = 0; i < 27; i++) {
                let slotDiv = document.createElement('div');
                slotDiv.className = 'chest-slot';
                let slotData = contents[i];
                if (slotData) {
                    let img = document.createElement('img');
                    img.src = texturePaths[slotData.type] || texturePaths[TYPES.GRASS];
                    let span = document.createElement('span');
                    span.innerText = slotData.count;
                    slotDiv.appendChild(img);
                    slotDiv.appendChild(span);
                } else {
                    slotDiv.style.background = "#2a2a2a";
                }

                slotDiv.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    if (e.button === 0) {
                        if (contents[i]) {
                            const item = contents[i];
                            addToInventory(item.type, 1, { name: BLOCK_NAMES[item.type] || "Блок" }, false);
                            item.count--;
                            if (item.count <= 0) {
                                contents[i] = null;
                            }
                            chestContents.set(key, contents);
                            renderChestMenu(chestX, chestY);
                            saveGame();
                        }
                    } else if (e.button === 2) {
                        const invItem = inventory[selectedSlot];
                        if (invItem && invItem.count > 0 && !invItem.isPickaxe && !invItem.isSword && !invItem.isFlint) {
                            if (!contents[i]) {
                                contents[i] = { type: invItem.type, count: 1 };
                                removeFromSlot(selectedSlot, 1);
                            } else if (contents[i].type === invItem.type) {
                                contents[i].count++;
                                removeFromSlot(selectedSlot, 1);
                            }
                            chestContents.set(key, contents);
                            renderChestMenu(chestX, chestY);
                            saveGame();
                        }
                    }
                });
                grid.appendChild(slotDiv);
            }

            let closeBtn = document.createElement('button');
            closeBtn.innerText = "Закрыть (Esc)";
            closeBtn.className = 'chest-close';
            closeBtn.onclick = () => {
                document.querySelector('.chest-overlay')?.remove();
            };

            menu.appendChild(grid);
            menu.appendChild(closeBtn);
            overlay.appendChild(menu);
            document.body.appendChild(overlay);
        }

        const SHAPELESS_RECIPES = [
            { name: "Доски", type: TYPES.PLANKS, count: 4, needs: { [TYPES.WOOD]: 1 } },
            { name: "Палка", type: TYPES.STICK, count: 4, needs: { [TYPES.PLANKS]: 2 } },
            { name: "Верстак", type: TYPES.CRAFTING_TABLE, count: 1, needs: { [TYPES.PLANKS]: 4 } }
        ];

        function canCraftSticks() {
            return hasCraftedWorkbench || inventory.some(item => item.type === TYPES.CRAFTING_TABLE);
        }

        function matchShapelessWithCheck(slots) {
            const counts = {};
            let filled = 0;
            for (const s of slots) {
                if (!s) continue;
                filled++;
                counts[s.type] = (counts[s.type] || 0) + s.count;
            }
            if (filled === 0) return null;

            for (const recipe of SHAPELESS_RECIPES) {
                if (recipe.type === TYPES.STICK && !canCraftSticks()) continue;

                const needKeys = Object.keys(recipe.needs);
                const haveKeys = Object.keys(counts);
                if (needKeys.length !== haveKeys.length) continue;
                let ok = true;
                for (const k of needKeys) {
                    if (counts[k] !== recipe.needs[k]) { ok = false; break; }
                }
                if (ok) return recipe;
            }
            return null;
        }

        function checkCrafting3x3() {
            for (let recipe of RECIPES_3X3) {
                if (recipe.type === TYPES.STICK) continue;

                let match = true;
                for (let i = 0; i < 9; i++) {
                    let slotType = craftingSlots[i] ? craftingSlots[i].type : null;
                    if (slotType !== recipe.pattern[i]) { match = false; break; }
                }
                if (match) {
                    if (recipe.type === TYPES.CRAFTING_TABLE) {
                        hasCraftedWorkbench = true;
                    }
                    craftResult3x3(recipe);
                    return;
                }
            }

            const shapeless = matchShapelessWithCheck(craftingSlots);
            if (shapeless) {
                if (shapeless.type === TYPES.CRAFTING_TABLE) {
                    hasCraftedWorkbench = true;
                }
                craftResult3x3(shapeless);
            }
        }

        function craftResult3x3(recipe) {
            addToInventory(recipe.type, recipe.count, {
                name: recipe.name,
                isPickaxe: recipe.isPickaxe,
                isSword: recipe.isSword,
                isFlint: recipe.isFlint,
                pickaxeTier: recipe.pickaxeTier
            }, false);
            craftingSlots = Array(9).fill(null);
            renderCraftingMenu();
            saveGame();
        }

        function checkCrafting2x2() {
            const recipe = matchShapelessWithCheck(inventoryCraftingSlots);
            if (recipe) {
                if (recipe.type === TYPES.CRAFTING_TABLE) {
                    hasCraftedWorkbench = true;
                }
                addToInventory(recipe.type, recipe.count, { name: recipe.name }, false);
                inventoryCraftingSlots = Array(4).fill(null);
                renderInventoryMenu();
                saveGame();
            }
        }

        function isTrapdoorOpen(x, y) { return trapdoorStates.get(`${x},${y}`) === true; }
        function setTrapdoorOpen(x, y, open) { trapdoorStates.set(`${x},${y}`, open); }

        function getBlockForPhysics(x, y) {
            let type = getBlock(x, y);
            if (type === TYPES.TRAPDOOR && isTrapdoorOpen(x, y)) return TYPES.AIR;
            return type;
        }

        function isSolid(type) { return type !== TYPES.AIR; }

        function getPickaxeTier(item) {
            if (!item || !item.isPickaxe) return -1;
            return item.pickaxeTier !== undefined ? item.pickaxeTier : 0;
        }

        function canBreakBlock(blockType, pickaxeTier) {
            if (isCreative) return true;
            if (!REQUIRES_PICKAXE.has(blockType)) return true;
            const requiredTier = ORE_TIERS[blockType] ?? 0;
            return pickaxeTier >= requiredTier;
        }

        function breakBlockAt(mouseWorldX, mouseWorldY) {
            let tx = Math.floor(mouseWorldX / TILE_SIZE);
            let ty = Math.floor(mouseWorldY / TILE_SIZE);
            let pxBlock = Math.floor(playerX / TILE_SIZE);
            let pyBlock = Math.floor(playerY / TILE_SIZE);

            if (Math.abs(pxBlock - tx) + Math.abs(pyBlock - ty) > BUILD_DISTANCE) return false;

            let type = getBlock(tx, ty);
            if (type === TYPES.AIR) return false;

            const surfaceY = terrainHeight(tx);
            if (ty > surfaceY + WORLD_BOTTOM) {
                return false;
            }

            if (REQUIRES_PICKAXE.has(type) && !isCreative) {
                const held = inventory[selectedSlot];
                const tier = getPickaxeTier(held);
                if (tier < 0 || !canBreakBlock(type, tier)) {
                    return false;
                }
            }

            setBlock(tx, ty, TYPES.AIR);
            trapdoorStates.delete(`${tx},${ty}`);
            chestContents.delete(getChestKey(tx, ty));

            if (!isCreative) {
                addToInventory(type, 1, {}, true);
            }
            return true;
        }

        function placeBlockAt(mouseWorldX, mouseWorldY) {
            let tx = Math.floor(mouseWorldX / TILE_SIZE);
            let ty = Math.floor(mouseWorldY / TILE_SIZE);
            let pxBlock = Math.floor(playerX / TILE_SIZE);
            let pyBlock = Math.floor(playerY / TILE_SIZE);

            if (Math.abs(pxBlock - tx) + Math.abs(pyBlock - ty) > BUILD_DISTANCE) return false;
            if (Math.abs(pxBlock - tx) < 0.8 && Math.abs(pyBlock - ty) < 0.8) return false;

            const surfaceY = terrainHeight(tx);
            if (ty > surfaceY + WORLD_BOTTOM) {
                return false;
            }

            let item = inventory[selectedSlot];
            if (item && item.count > 0 && getBlock(tx, ty) === TYPES.AIR && item.type !== undefined
                && !item.isPickaxe && !item.isSword && !item.isFlint) {
                setBlock(tx, ty, item.type);
                if (item.type === TYPES.TRAPDOOR) setTrapdoorOpen(tx, ty, false);
                if (!isCreative) {
                    removeFromSlot(selectedSlot, 1);
                }
                return true;
            }
            return false;
        }

        function useItem() {
            if (isCraftingOpen || isInventoryOpen) return;

            let mx = lastMouseCanvas.x + cameraX;
            let my = lastMouseCanvas.y + cameraY;
            let tx = Math.floor(mx / TILE_SIZE);
            let ty = Math.floor(my / TILE_SIZE);

            let pxBlock = Math.floor(playerX / TILE_SIZE);
            let pyBlock = Math.floor(playerY / TILE_SIZE);
            if (Math.abs(pxBlock - tx) + Math.abs(pyBlock - ty) > BUILD_DISTANCE) return;

            let blockType = getBlock(tx, ty);

            if (blockType === TYPES.CHEST) {
                openChest(tx, ty);
                return;
            }

            if (blockType === TYPES.CRAFTING_TABLE) {
                openCraftingTable(tx, ty);
                return;
            }

            let item = inventory[selectedSlot];
            if (blockType === TYPES.DYNAMITE && item && item.isFlint) {
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        let nx = tx + dx, ny = ty + dy;
                        let bType = getBlock(nx, ny);
                        if (bType !== TYPES.AIR && bType !== TYPES.DYNAMITE) {
                            if (!isCreative) {
                                addToInventory(bType, 1, {}, true);
                            }
                        }
                        setBlock(nx, ny, TYPES.AIR);
                        trapdoorStates.delete(`${nx},${ny}`);
                        chestContents.delete(getChestKey(nx, ny));
                    }
                }
                if (!isCreative) {
                    removeFromSlot(selectedSlot, 1);
                }
            }
        }

        function toggleInventory() {
            if (isCraftingOpen) {
                closeCrafting();
                return;
            }
            isInventoryOpen = !isInventoryOpen;
            if (isInventoryOpen) {
                renderInventoryMenu();
            } else {
                closeInventory();
            }
        }

        function closeInventory() {
            isInventoryOpen = false;
            for (let i = 0; i < 4; i++) {
                if (inventoryCraftingSlots[i]) {
                    addToInventory(inventoryCraftingSlots[i].type, inventoryCraftingSlots[i].count, {}, false);
                }
            }
            inventoryCraftingSlots = Array(4).fill(null);

        function getPlayerBBox() {
            return { x: playerX - PLAYER_SIZE/2, y: playerY - PLAYER_SIZE/2, w: PLAYER_SIZE, h: PLAYER_SIZE };
        }

        function collideWithWorld(bbox) {
            let startX = Math.floor(bbox.x / TILE_SIZE);
            let endX = Math.floor((bbox.x + bbox.w) / TILE_SIZE);
            let startY = Math.floor(bbox.y / TILE_SIZE);
            let endY = Math.floor((bbox.y + bbox.h) / TILE_SIZE);
            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    if (isSolid(getBlockForPhysics(x, y))) return true;
                }
            }
            return false;
        }

        function handleCollisions(moveX, moveY) {
            playerX += moveX;
            if (collideWithWorld(getPlayerBBox())) playerX -= moveX;

            playerY += moveY;
            if (collideWithWorld(getPlayerBBox())) {
                playerY -= moveY;
                if (moveY > 0) { onGround = true; velocityY = 0; }
            } else if (moveY > 0) {
                onGround = false;
            }
        }

        function updateGame(delta) {
            let moveX = 0;
            if (keys.ArrowLeft || keys.KeyA) moveX = -1;
            if (keys.ArrowRight || keys.KeyD) moveX = 1;
            if (moveX !== 0) facingRight = moveX > 0;

            if ((keys.Space || keys.ArrowUp || keys.KeyW) && onGround) {
                velocityY = JUMP_POWER;
                onGround = false;
            }

            velocityY += GRAVITY * delta;
            handleCollisions(moveX * PLAYER_SPEED * delta, velocityY * delta);

            const surfaceY = terrainHeight(Math.floor(playerX / TILE_SIZE));
            if (playerY > (surfaceY + WORLD_BOTTOM + 5) * TILE_SIZE) {
                const spawnX = Math.floor(playerX / TILE_SIZE);
                let spawnY = 0;
                for (let y = 0; y < 200; y++) {
                    if (getBlock(spawnX, y) !== TYPES.AIR) { spawnY = y; break; }
                }
                playerY = (spawnY - 3) * TILE_SIZE;
                velocityY = 0;
            }

            cameraX = playerX - canvas.width/2;
            cameraY = playerY - canvas.height/2;

            gameTime += delta;

            updateChunks();
        }

        let lastMouseCanvas = { x: 0, y: 0 };

        function drawBlock(ctx, type, x, y, size) {
            let tex = textures[type];
            if (tex && tex.complete && tex.naturalWidth > 0) {
                ctx.drawImage(tex, x, y, size, size);
            } else {
                ctx.fillStyle = FALLBACK_COLORS[type] || "#f0f";
                ctx.fillRect(x, y, size, size);
                ctx.strokeStyle = "rgba(0,0,0,0.3)";
                ctx.lineWidth = 2;
                ctx.strokeRect(x+1, y+1, size-2, size-2);
            }
        }

        function getSkyState() {
            const t = (gameTime % DAY_LENGTH) / DAY_LENGTH;
            const sunAngle = t * Math.PI * 2 - Math.PI / 2;
            const sunHeight = Math.sin(sunAngle);

            const dayTop = [135, 206, 235];
            const dayBottom = [200, 230, 245];
            const sunsetTop = [255, 140, 90];
            const sunsetBottom = [255, 190, 130];
            const nightTop = [8, 10, 30];
            const nightBottom = [15, 18, 45];

            function lerp(a, b, f) { return a + (b - a) * f; }
            function mixColor(c1, c2, f) {
                return [lerp(c1[0],c2[0],f), lerp(c1[1],c2[1],f), lerp(c1[2],c2[2],f)];
            }

            let skyTop, skyBottom, darkness;
            if (sunHeight > 0.35) {
                skyTop = dayTop; skyBottom = dayBottom; darkness = 0;
            } else if (sunHeight > 0) {
                const f = 1 - (sunHeight / 0.35);
                skyTop = mixColor(dayTop, sunsetTop, f);
                skyBottom = mixColor(dayBottom, sunsetBottom, f);
                darkness = f * 0.15;
            } else if (sunHeight > -0.35) {
                const f = -sunHeight / 0.35;
                skyTop = mixColor(sunsetTop, nightTop, f);
                skyBottom = mixColor(sunsetBottom, nightBottom, f);
                darkness = 0.15 + f * 0.55;
            } else {
                skyTop = nightTop; skyBottom = nightBottom; darkness = 0.7;
            }

            return { skyTop, skyBottom, darkness, sunHeight, t };
        }

        function drawSky(sky) {
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, `rgb(${sky.skyTop[0]|0},${sky.skyTop[1]|0},${sky.skyTop[2]|0})`);
            grad.addColorStop(1, `rgb(${sky.skyBottom[0]|0},${sky.skyBottom[1]|0},${sky.skyBottom[2]|0})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (sky.darkness > 0.25) {
                const alpha = Math.min(1, (sky.darkness - 0.25) / 0.45);
                ctx.save();
                for (const s of stars) {
                    const tw = 0.6 + 0.4 * Math.sin(gameTime * 2 + s.twinkle);
                    ctx.globalAlpha = alpha * tw;
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            const arcCenterX = canvas.width / 2;
            const arcCenterY = canvas.height * 0.85;
            const arcRadius = canvas.width * 0.6;
            const angle = sky.t * Math.PI * 2 - Math.PI / 2;
            const bodyX = arcCenterX + Math.cos(angle) * arcRadius;
            const bodyY = arcCenterY + Math.sin(angle) * arcRadius * 0.9;

            if (bodyY < canvas.height * 0.75) {
                const isSun = sky.sunHeight > -0.05;
                ctx.beginPath();
                ctx.fillStyle = isSun ? "#fff6d0" : "#dbe6f5";
                ctx.shadowColor = isSun ? "#ffdd88" : "#aac4ff";
                ctx.shadowBlur = 25;
                ctx.arc(bodyX, bodyY, 26, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function drawGame() {
            if (!ctx) return;
            const sky = getSkyState();
            drawSky(sky);

            let startX = Math.floor(cameraX / TILE_SIZE);
            let endX = Math.floor((cameraX + canvas.width) / TILE_SIZE) + 1;
            let startY = Math.floor(cameraY / TILE_SIZE);
            let endY = Math.floor((cameraY + canvas.height) / TILE_SIZE) + 1;

            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    let type = getBlock(x, y);
                    if (type !== TYPES.AIR) {
                        drawBlock(ctx, type, x * TILE_SIZE - cameraX, y * TILE_SIZE - cameraY, TILE_SIZE);
                    }
                }
            }

            if (selectionStart && selectionEnd) {
                const minX = Math.min(selectionStart.x, selectionEnd.x) * TILE_SIZE - cameraX;
                const maxX = (Math.max(selectionStart.x, selectionEnd.x) + 1) * TILE_SIZE - cameraX;
                const minY = Math.min(selectionStart.y, selectionEnd.y) * TILE_SIZE - cameraY;
                const maxY = (Math.max(selectionStart.y, selectionEnd.y) + 1) * TILE_SIZE - cameraY;

                ctx.fillStyle = 'rgba(255, 255, 100, 0.15)';
                ctx.fillRect(minX, minY, maxX - minX, maxY - minY);
                ctx.strokeStyle = '#ffcc44';
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 6]);
                ctx.strokeRect(minX, minY, maxX - minX, maxY - minY);
                ctx.setLineDash([]);

                ctx.fillStyle = '#ffcc44';
                ctx.font = '12px Minecraft Rus, monospace';
                ctx.fillText(`(${Math.min(selectionStart.x, selectionEnd.x)}, ${Math.min(selectionStart.y, selectionEnd.y)})`, minX + 4, minY + 16);
                ctx.fillText(`(${Math.max(selectionStart.x, selectionEnd.x)}, ${Math.max(selectionStart.y, selectionEnd.y)})`, maxX - 80, maxY - 6);
                
                const w = Math.abs(selectionEnd.x - selectionStart.x) + 1;
                const h = Math.abs(selectionEnd.y - selectionStart.y) + 1;
                ctx.fillStyle = '#ffffff';
                ctx.font = '13px Minecraft Rus, monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`${w}×${h}`, (minX + maxX) / 2, minY - 10);
                ctx.textAlign = 'left';
            }

            if (sky.darkness > 0) {
                ctx.fillStyle = `rgba(10, 12, 35, ${sky.darkness * 0.55})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            let px = playerX - PLAYER_SIZE/2 - cameraX;
            let py = playerY - PLAYER_SIZE/2 - cameraY;

            ctx.fillStyle = "#3d7bd9";
            ctx.fillRect(px, py + PLAYER_SIZE*0.35, PLAYER_SIZE, PLAYER_SIZE*0.4);
            ctx.fillStyle = "#4a4a7a";
            ctx.fillRect(px, py + PLAYER_SIZE*0.75, PLAYER_SIZE, PLAYER_SIZE*0.25);
            ctx.fillStyle = "#e0a878";
            ctx.fillRect(px + PLAYER_SIZE*0.08, py - PLAYER_SIZE*0.05, PLAYER_SIZE*0.84, PLAYER_SIZE*0.42);
            ctx.fillStyle = "#6b4a2f";
            ctx.fillRect(px + PLAYER_SIZE*0.08, py - PLAYER_SIZE*0.1, PLAYER_SIZE*0.84, PLAYER_SIZE*0.15);
            ctx.fillStyle = "#222";
            const eyeX = facingRight ? px + PLAYER_SIZE*0.55 : px + PLAYER_SIZE*0.18;
            ctx.fillRect(eyeX, py + PLAYER_SIZE*0.1, PLAYER_SIZE*0.12, PLAYER_SIZE*0.12);

            const held = inventory[selectedSlot];
            if (held && (held.isPickaxe || held.isSword)) {
                const handX = facingRight ? px + PLAYER_SIZE : px - PLAYER_SIZE*0.3;
                if (held.isPickaxe) {
                    const colors = ["#8d6e63", "#888888", "#c0c0c0", "#4ff2f2", "#ffaa66"];
                    const tier = held.pickaxeTier || 0;
                    ctx.fillStyle = colors[tier] || "#8d6e63";
                } else {
                    ctx.fillStyle = held.isSword ? "#cfd8dc" : "#8d6e63";
                }
                ctx.fillRect(handX, py + PLAYER_SIZE*0.3, PLAYER_SIZE*0.3, PLAYER_SIZE*0.5);
            }

            let wx = lastMouseCanvas.x + cameraX;
            let wy = lastMouseCanvas.y + cameraY;
            let hx = Math.floor(wx / TILE_SIZE);
            let hy = Math.floor(wy / TILE_SIZE);
            ctx.strokeStyle = "#ffff88";
            ctx.lineWidth = 3;
            ctx.strokeRect(hx * TILE_SIZE - cameraX, hy * TILE_SIZE - cameraY, TILE_SIZE, TILE_SIZE);

            let item = inventory[selectedSlot];
            let coordText = `📍 ${Math.floor(playerX/TILE_SIZE)}, ${Math.floor(playerY/TILE_SIZE)}`;
            let itemText = item ? `${item.name} x${item.count}` : "Пусто";
            if (item && item.isPickaxe) {
                const tierNames = ["Дерев.", "Камен.", "Желез.", "Алмаз.", "Пласт."];
                const tier = item.pickaxeTier || 0;
                itemText += ` (${tierNames[tier]})`;
            }
            let timeText = sky.darkness > 0.5 ? "🌙" : (sky.darkness > 0.1 ? "🌆" : "☀️");
            let buildText = buildMode ? " 🏗️" : "";
            let creativeText = isCreative ? " 🎨" : "";
            document.getElementById('coordInfo').innerText = `${coordText} | ${itemText} | ${timeText}${buildText}${creativeText}`;
        }

        function getBlockInArea(x1, y1, x2, y2) {
            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);
            
            const blocks = [];
            for (let y = minY; y <= maxY; y++) {
                const row = [];
                for (let x = minX; x <= maxX; x++) {
                    const blockType = getBlock(x, y);
                    const isTrapdoorOpen = trapdoorStates.get(`${x},${y}`) === true;
                    row.push({
                        type: blockType,
                        trapdoorOpen: isTrapdoorOpen
                    });
                }
                blocks.push(row);
            }
            return {
                width: maxX - minX + 1,
                height: maxY - minY + 1,
                offsetX: minX,
                offsetY: minY,
                blocks: blocks
            };
        }

        function exportBuild() {
            if (!selectionStart || !selectionEnd) {
                showBuildStatus('❌ Сначала выделите область (нажмите B и выделите два угла)', 'error');
                return;
            }

            const data = getBlockInArea(
                selectionStart.x, selectionStart.y,
                selectionEnd.x, selectionEnd.y
            );

            let hasBlocks = false;
            for (const row of data.blocks) {
                for (const block of row) {
                    if (block.type !== TYPES.AIR) {
                        hasBlocks = true;
                        break;
                    }
                }
                if (hasBlocks) break;
            }

            if (!hasBlocks) {
                showBuildStatus('❌ В выделенной области нет блоков для экспорта', 'error');
                return;
            }

            const jsonData = JSON.stringify(data);
            const blob = new Blob([jsonData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `build_${Date.now()}.qwqeqeBILD`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showBuildStatus(`✅ Постройка экспортирована! (${data.width}x${data.height})`, 'success');
            selectionStart = null;
            selectionEnd = null;
            buildMode = false;
        }

        function importBuild(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (!data.blocks || !data.width || !data.height) {
                        throw new Error('Неверный формат файла');
                    }

                    if (!selectionStart) {
                        showBuildStatus('❌ Нажмите B, чтобы выбрать место для вставки (верхний левый угол)', 'error');
                        return;
                    }

                    const startX = selectionStart.x;
                    const startY = selectionStart.y;

                    let placed = 0;
                    for (let row = 0; row < data.height; row++) {
                        for (let col = 0; col < data.width; col++) {
                            const blockData = data.blocks[row][col];
                            if (blockData.type !== TYPES.AIR) {
                                const worldX = startX + col;
                                const worldY = startY + row;
                                setBlock(worldX, worldY, blockData.type);
                                if (blockData.type === TYPES.TRAPDOOR) {
                                    trapdoorStates.set(`${worldX},${worldY}`, blockData.trapdoorOpen || false);
                                }
                                placed++;
                            }
                        }
                    }

                    showBuildStatus(`✅ Постройка импортирована! (${placed} блоков)`, 'success');
                    selectionStart = null;
                    selectionEnd = null;
                    buildMode = false;
                    saveGame();
                } catch(err) {
                    showBuildStatus(`❌ Ошибка импорта: ${err.message}`, 'error');
                }
            };
            reader.readAsText(file);
        }

        function clearArea() {
            if (!selectionStart || !selectionEnd) {
                showBuildStatus('❌ Сначала выделите область (нажмите B и выделите два угла)', 'error');
                return;
            }

            const minX = Math.min(selectionStart.x, selectionEnd.x);
            const maxX = Math.max(selectionStart.x, selectionEnd.x);
            const minY = Math.min(selectionStart.y, selectionEnd.y);
            const maxY = Math.max(selectionStart.y, selectionEnd.y);

            let cleared = 0;
            for (let y = minY; y <= maxY; y++) {
                for (let x = minX; x <= maxX; x++) {
                    const type = getBlock(x, y);
                    if (type !== TYPES.AIR) {
                        setBlock(x, y, TYPES.AIR);
                        trapdoorStates.delete(`${x},${y}`);
                        chestContents.delete(getChestKey(x, y));
                        cleared++;
                    }
                }
            }

            showBuildStatus(`🗑️ Очищено ${cleared} блоков`, 'success');
            selectionStart = null;
            selectionEnd = null;
            buildMode = false;
            saveGame();
        }

        function showBuildStatus(message, type = 'info') {
            const el = document.getElementById('buildStatus');
            el.textContent = message;
            el.className = 'build-status show ' + type;
            clearTimeout(el._hideTimer);
            el._hideTimer = setTimeout(() => {
                el.className = 'build-status';
            }, 3000);
        }

        let loaded = 0, total = Object.keys(texturePaths).length;
        for (let [type, path] of Object.entries(texturePaths)) {
            let img = new Image();
            img.onload = img.onerror = () => { loaded++; if(loaded===total) startGame(); };
            img.src = path;
            textures[type] = img;
        }

        let gameReady = false;
        function startGame() {
            initWorld();
            updateHotbarUI();
            gameReady = true;

            setInterval(saveGame, 5000);
        }

        window.onload = () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; regenerateStars(); }
            resize();
            window.addEventListener('resize', resize);

            document.getElementById('creativeBtn').addEventListener('click', toggleCreative);
            document.getElementById('dungeonBtn').addEventListener('click', generateDungeonAtPlayer);
            document.getElementById('exportBtn').addEventListener('click', exportBuild);
            document.getElementById('importBtn').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });
            document.getElementById('clearBtn').addEventListener('click', clearArea);
            document.getElementById('fileInput').addEventListener('change', function(e) {
                if (this.files.length > 0) {
                    importBuild(this.files[0]);
                    this.value = '';
                }
            });

            canvas.addEventListener('mousemove', (e) => {
                let rect = canvas.getBoundingClientRect();
                lastMouseCanvas = { x: (e.clientX - rect.left) * (canvas.width/rect.width), y: (e.clientY - rect.top) * (canvas.height/rect.height) };
            });

            canvas.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (isCraftingOpen || isInventoryOpen) return;
                let wx = lastMouseCanvas.x + cameraX;
                let wy = lastMouseCanvas.y + cameraY;
                let tx = Math.floor(wx / TILE_SIZE);
                let ty = Math.floor(wy / TILE_SIZE);

                if (buildMode) {
                    if (e.button === 0) {
                        if (!selectionStart) {
                            selectionStart = { x: tx, y: ty };
                            selectionEnd = { x: tx, y: ty };
                            showBuildStatus(`🔲 Первый угол: (${tx}, ${ty})`, 'info');
                        } else {
                            selectionEnd = { x: tx, y: ty };
                            showBuildStatus(`🔲 Область выделена: (${Math.abs(selectionEnd.x - selectionStart.x) + 1}×${Math.abs(selectionEnd.y - selectionStart.y) + 1})`, 'success');
                            buildMode = false;
                            updateHotbarUI();
                        }
                        return;
                    }
                    if (e.button === 2) {
                        selectionStart = null;
                        selectionEnd = null;
                        buildMode = false;
                        showBuildStatus('❌ Выделение отменено', 'error');
                        updateHotbarUI();
                        return;
                    }
                }

                if (e.button === 0) {
                    breakBlockAt(wx, wy);
                } else if (e.button === 2) {
                    placeBlockAt(wx, wy);
                }
            });

            canvas.addEventListener('contextmenu', e => e.preventDefault());
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                if (isCraftingOpen || isInventoryOpen) return;
                if (inventory.length === 0) return;
                selectedSlot = (e.deltaY > 0) ? (selectedSlot + 1) % inventory.length : (selectedSlot - 1 + inventory.length) % inventory.length;
                updateHotbarUI();
            });

            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'KeyF') {
                    e.preventDefault();
                    useItem();
                }
                if (e.code === 'KeyE') {
                    e.preventDefault();
                    toggleInventory();
                }
                if (e.code === 'KeyB') {
                    e.preventDefault();
                    buildMode = !buildMode;
                    if (!buildMode) {
                        selectionStart = null;
                        selectionEnd = null;
                        showBuildStatus('❌ Режим выделения отключен', 'error');
                    } else {
                        showBuildStatus('🏗️ Режим выделения: кликните ЛКМ по двум углам области', 'info');
                    }
                    updateHotbarUI();
                }
                if (e.code === 'KeyG') {
                    e.preventDefault();
                    toggleCreative();
                }
                if (e.code === 'KeyD') {
                    e.preventDefault();
                    generateDungeonAtPlayer();
                }
                if (e.code >= 'Digit1' && e.code <= 'Digit9') {
                    let num = parseInt(e.code.slice(5)) - 1;
                    if (num < inventory.length) {
                        selectedSlot = num;
                        updateHotbarUI();
                    }
                    e.preventDefault();
                }
                if (e.code === 'Escape') {
                    if (isCraftingOpen) closeCrafting();
                    else if (isInventoryOpen) closeInventory();
                    else if (document.querySelector('.chest-overlay')) {
                        document.querySelector('.chest-overlay')?.remove();
                    }
                    else if (buildMode) {
                        buildMode = false;
                        selectionStart = null;
                        selectionEnd = null;
                        showBuildStatus('❌ Режим выделения отключен', 'error');
                        updateHotbarUI();
                    }
                }
            });
            window.addEventListener('keyup', (e) => keys[e.code] = false);

            window.addEventListener('beforeunload', saveGame);
            window.addEventListener('pagehide', saveGame);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) saveGame();
            });

            let lastTime = 0;
            function animate(now) {
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                if (delta > 0.001 && gameReady) updateGame(delta);
                if (gameReady) drawGame();
                lastTime = now;
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);
        };
    })();
</script>
</body>
</html>
