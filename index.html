<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Craft - Бесконечный мир | Скины</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1a2a32;
            overflow: hidden;
            font-family: 'Minecraft Rus', 'Minecraft', 'Courier New', monospace;
            touch-action: none;
        }
        @font-face {
            font-family: 'Minecraft Rus';
            src: url('Minecraft Rus.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #6b8c9e;
            cursor: crosshair;
        }
        .ui-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            z-index: 100;
            border: 2px solid #8b8b8b;
            font-family: 'Minecraft Rus', monospace;
            pointer-events: auto;
        }
        .hotbar {
            display: flex;
            gap: 8px;
            background: #2c2c2c;
            padding: 8px 12px;
            border-radius: 12px;
        }
        .slot {
            width: 64px;
            height: 64px;
            background: #3a3a3a;
            border: 3px solid #5a5a5a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
            position: relative;
        }
        .slot.selected {
            border: 3px solid #ffcc44;
            background: #4e4e4e;
            box-shadow: 0 0 0 2px #ffaa33;
        }
        .slot img {
            width: 48px;
            height: 48px;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        .slot span {
            font-size: 14px;
            color: white;
            text-shadow: 1px 1px 0 black;
        }
        .info {
            background: #1f1f1fe6;
            padding: 8px 18px;
            border-radius: 40px;
            color: #f5f5dc;
            font-size: 20px;
            min-width: 200px;
        }
        .skin-upload {
            background: #2a6e3a;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: center;
            border: none;
            color: white;
            font-family: inherit;
        }
        .skin-upload:hover {
            background: #3e8e4a;
        }
        @media (max-width: 700px) {
            .slot { width: 48px; height: 48px; }
            .slot img { width: 36px; height: 36px; }
            .info { font-size: 14px; min-width: 140px; }
        }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="ui-panel">
    <div class="hotbar" id="hotbarContainer"></div>
    <div class="info" id="coordInfo">X: 0 | Z: 0</div>
    <button class="skin-upload" id="skinUploadBtn">🎮 Загрузить скин (PNG)</button>
    <input type="file" id="skinFileInput" accept="image/png" style="display:none">
</div>

<script>
    (function(){
        // ============ КОНФИГУРАЦИЯ ============
        const TILE_SIZE = 48;
        const CHUNK_SIZE = 16;
        const RENDER_DISTANCE = 2; // чанков в каждую сторону
        
        // Типы блоков
        const TYPES = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3,
            WOOD_OAK: 4,
            LEAVES: 5
        };
        
        const BLOCK_NAMES = {
            [TYPES.GRASS]: "Трава",
            [TYPES.DIRT]: "Земля",
            [TYPES.STONE]: "Камень",
            [TYPES.WOOD_OAK]: "Древесина",
            [TYPES.LEAVES]: "Листва"
        };
        
        // Текстуры
        const textures = {};
        const textureFiles = {
            [TYPES.GRASS]: "texturs/grass.png",
            [TYPES.DIRT]: "texturs/dirt.png",
            [TYPES.STONE]: "texturs/stone.png",
            [TYPES.WOOD_OAK]: "texturs/wood-oak.png",
            [TYPES.LEAVES]: "texturs/listva.png"
        };
        
        // Инвентарь (5 слотов для новых блоков)
        let selectedSlot = 0;
        let inventory = [
            { type: TYPES.GRASS, count: 64, name: "Трава" },
            { type: TYPES.DIRT, count: 64, name: "Земля" },
            { type: TYPES.STONE, count: 32, name: "Камень" },
            { type: TYPES.WOOD_OAK, count: 32, name: "Древесина" },
            { type: TYPES.LEAVES, count: 32, name: "Листва" }
        ];
        
        // Мир: чанки Map ключ "x,y"
        let chunks = new Map();
        
        // Игрок
        let playerX = 0, playerY = 0;
        let velocityY = 0;
        let onGround = true;
        const PLAYER_SIZE = TILE_SIZE * 0.7;
        const PLAYER_SPEED = 380;
        const GRAVITY = 1600;
        const JUMP_POWER = -520;
        
        // Камера
        let cameraX = 0, cameraY = 0;
        
        // Управление
        const keys = {};
        
        // Скин игрока (по умолчанию Steve-like)
        let playerSkin = null;
        let skinLoaded = false;
        
        // Генератор шума (простой)
        function simpleNoise(x, scale) {
            return Math.sin(x * scale) * Math.cos(x * scale * 0.7);
        }
        
        // Генерация чанка
        function generateChunk(cx, cz) {
            const chunk = Array(CHUNK_SIZE).fill().map(() => Array(CHUNK_SIZE).fill(TYPES.AIR));
            const worldBaseX = cx * CHUNK_SIZE;
            const worldBaseZ = cz;
            
            for (let localX = 0; localX < CHUNK_SIZE; localX++) {
                const worldX = worldBaseX + localX;
                // Высота ландшафта (шум)
                let height = Math.floor(12 + 
                    simpleNoise(worldX * 0.1, 0.5) * 3 +
                    simpleNoise(worldX * 0.03, 1.2) * 2);
                height = Math.min(CHUNK_SIZE-2, Math.max(4, height));
                
                for (let y = 0; y < CHUNK_SIZE; y++) {
                    if (y < height - 3) chunk[y][localX] = TYPES.STONE;
                    else if (y < height - 1) chunk[y][localX] = TYPES.DIRT;
                    else if (y === height-1) chunk[y][localX] = TYPES.GRASS;
                    else chunk[y][localX] = TYPES.AIR;
                }
                
                // редкие деревья
                if (simpleNoise(worldX * 0.2, 1.3) > 0.6 && height < CHUNK_SIZE-5) {
                    const treeX = localX;
                    const treeY = height;
                    if (treeY+1 < CHUNK_SIZE) chunk[treeY][treeX] = TYPES.WOOD_OAK;
                    if (treeY+2 < CHUNK_SIZE) chunk[treeY+1][treeX] = TYPES.WOOD_OAK;
                    if (treeY+3 < CHUNK_SIZE) chunk[treeY+2][treeX] = TYPES.WOOD_OAK;
                    // листва
                    for (let ly = -1; ly <= 1; ly++) {
                        for (let lx = -1; lx <= 1; lx++) {
                            const nx = treeX + lx;
                            const ny = treeY + 2 + ly;
                            if (nx>=0 && nx<CHUNK_SIZE && ny>=0 && ny<CHUNK_SIZE && chunk[ny][nx] === TYPES.AIR)
                                chunk[ny][nx] = TYPES.LEAVES;
                        }
                    }
                }
            }
            return chunk;
        }
        
        function getBlock(worldX, worldY) {
            if (worldY < 0 || worldY >= 256) return TYPES.AIR;
            const cx = Math.floor(worldX / CHUNK_SIZE);
            const cz = 0;
            const key = `${cx},${cz}`;
            if (!chunks.has(key)) {
                chunks.set(key, generateChunk(cx, cz));
            }
            const chunk = chunks.get(key);
            const localX = ((worldX % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
            if (worldY < CHUNK_SIZE) return chunk[worldY][localX];
            return TYPES.AIR;
        }
        
        function setBlock(worldX, worldY, type) {
            if (worldY < 0 || worldY >= 256) return false;
            const cx = Math.floor(worldX / CHUNK_SIZE);
            const cz = 0;
            const key = `${cx},${cz}`;
            if (!chunks.has(key)) chunks.set(key, generateChunk(cx, cz));
            const chunk = chunks.get(key);
            const localX = ((worldX % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
            if (worldY < CHUNK_SIZE) {
                chunk[worldY][localX] = type;
                return true;
            }
            return false;
        }
        
        // Логика разрушения/постройки
        function breakBlockAt(worldX, worldY) {
            const type = getBlock(worldX, worldY);
            if (type !== TYPES.AIR) {
                setBlock(worldX, worldY, TYPES.AIR);
                for(let i=0; i<inventory.length; i++) {
                    if(inventory[i].type === type && inventory[i].count < 999) {
                        inventory[i].count++;
                        break;
                    }
                }
                return true;
            }
            return false;
        }
        
        function placeBlockAt(worldX, worldY) {
            const selected = inventory[selectedSlot];
            if(!selected || selected.count <= 0) return false;
            if(getBlock(worldX, worldY) === TYPES.AIR) {
                // проверка на игрока
                const px = playerX / TILE_SIZE;
                const py = playerY / TILE_SIZE;
                if(Math.abs(px - worldX) < 0.8 && Math.abs(py - worldY) < 0.8) return false;
                setBlock(worldX, worldY, selected.type);
                selected.count--;
                return true;
            }
            return false;
        }
        
        // Физика и коллизии с бесконечным миром
        function isSolid(x, y) {
            const type = getBlock(Math.floor(x), Math.floor(y));
            return type !== TYPES.AIR;
        }
        
        function handleCollisions(delta, moveX, moveY) {
            playerX += moveX;
            let bbox = { x: playerX - PLAYER_SIZE/2, y: playerY - PLAYER_SIZE/2, w: PLAYER_SIZE, h: PLAYER_SIZE };
            // горизонталь
            let ix1 = Math.floor(bbox.x / TILE_SIZE), ix2 = Math.floor((bbox.x+bbox.w-1)/TILE_SIZE);
            let iy1 = Math.floor(bbox.y / TILE_SIZE), iy2 = Math.floor((bbox.y+bbox.h-1)/TILE_SIZE);
            for(let y=iy1; y<=iy2; y++)
                for(let x=ix1; x<=ix2; x++)
                    if(isSolid(x, y)) { playerX -= moveX; break; }
            
            playerY += moveY;
            bbox = { x: playerX - PLAYER_SIZE/2, y: playerY - PLAYER_SIZE/2, w: PLAYER_SIZE, h: PLAYER_SIZE };
            ix1 = Math.floor(bbox.x / TILE_SIZE); ix2 = Math.floor((bbox.x+bbox.w-1)/TILE_SIZE);
            iy1 = Math.floor(bbox.y / TILE_SIZE); iy2 = Math.floor((bbox.y+bbox.h-1)/TILE_SIZE);
            let grounded = false;
            for(let y=iy1; y<=iy2; y++) {
                for(let x=ix1; x<=ix2; x++) {
                    if(isSolid(x, y)) {
                        if(moveY > 0) grounded = true;
                        playerY -= moveY;
                        break;
                    }
                }
            }
            onGround = grounded;
            if(grounded && moveY>0) velocityY = 0;
        }
        
        // Отрисовка скина (2D вид)
        function drawSkin(ctx, x, y, size) {
            if (!skinLoaded || !playerSkin) {
                ctx.fillStyle = "#5c9c3e";
                ctx.fillRect(x, y, size, size);
                ctx.fillStyle = "#2c2c2c";
                ctx.fillRect(x+size*0.2, y+size*0.7, size*0.6, size*0.1);
                return;
            }
            // Упрощённая отрисовка скина по зонам: голова
            const headSize = size * 0.5;
            const bodyHeight = size * 0.35;
            ctx.drawImage(playerSkin, 8, 8, 8, 8, x+size*0.25, y, headSize, headSize); // перед головы
            ctx.fillStyle = "#3c2f2f";
            ctx.fillRect(x+size*0.25, y+headSize, size*0.5, bodyHeight);
        }
        
        // Загрузка скина
        function loadSkin(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    playerSkin = img;
                    skinLoaded = true;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        // Отрисовка мира и игрока
        let canvas, ctx;
        let lastMouse = {x:0,y:0};
        
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            
            const startX = Math.floor(cameraX / TILE_SIZE);
            const endX = startX + Math.ceil(canvas.width/TILE_SIZE) + 2;
            const startY = Math.floor(cameraY / TILE_SIZE);
            const endY = startY + Math.ceil(canvas.height/TILE_SIZE) + 2;
            
            for(let y=startY; y<=endY; y++) {
                for(let x=startX; x<=endX; x++) {
                    let type = getBlock(x, y);
                    if(type !== TYPES.AIR) {
                        let img = textures[type];
                        let dx = x*TILE_SIZE - cameraX;
                        let dy = y*TILE_SIZE - cameraY;
                        if(img && img.complete) ctx.drawImage(img, dx, dy, TILE_SIZE, TILE_SIZE);
                        else {
                            ctx.fillStyle = type===TYPES.GRASS?"#5a8f3c":type===TYPES.DIRT?"#8b5a2b":type===TYPES.STONE?"#7d7d7d":type===TYPES.WOOD_OAK?"#a56b2f":"#2f6a2f";
                            ctx.fillRect(dx,dy,TILE_SIZE,TILE_SIZE);
                        }
                    }
                }
            }
            
            // игрок
            const px = playerX - PLAYER_SIZE/2 - cameraX;
            const py = playerY - PLAYER_SIZE/2 - cameraY;
            drawSkin(ctx, px, py, PLAYER_SIZE);
            
            // выделение
            let mx = lastMouse.x + cameraX;
            let my = lastMouse.y + cameraY;
            let tx = Math.floor(mx/TILE_SIZE), ty = Math.floor(my/TILE_SIZE);
            ctx.strokeStyle = "#ffff88";
            ctx.lineWidth = 2;
            ctx.strokeRect(tx*TILE_SIZE - cameraX, ty*TILE_SIZE - cameraY, TILE_SIZE, TILE_SIZE);
            
            document.getElementById('coordInfo').innerHTML = `🗺️ ${Math.floor(playerX/TILE_SIZE)} , ${Math.floor(playerY/TILE_SIZE)}  |  ${BLOCK_NAMES[inventory[selectedSlot].type]} x${inventory[selectedSlot].count}`;
        }
        
        function update(delta) {
            let move = 0;
            if(keys.ArrowLeft || keys.KeyA) move = -1;
            if(keys.ArrowRight || keys.KeyD) move = 1;
            let moveX = move * PLAYER_SPEED * delta;
            if((keys.Space || keys.ArrowUp || keys.KeyW) && onGround) velocityY = JUMP_POWER;
            velocityY += GRAVITY * delta;
            let moveY = velocityY * delta;
            handleCollisions(delta, moveX, moveY);
            
            playerX = Math.max(PLAYER_SIZE/2, Math.min(10000, playerX));
            if(playerY > 500) playerY = 80;
            
            cameraX = playerX - canvas.width/2;
            cameraY = playerY - canvas.height/2;
            cameraX = Math.max(0, Math.min(cameraX, 10000 - canvas.width));
            cameraY = Math.max(0, Math.min(cameraY, 300 - canvas.height));
        }
        
        // Загрузка текстур
        let loadedTex = 0, totalTex = Object.keys(textureFiles).length;
        function onTexLoad() { loadedTex++; if(loadedTex===totalTex) startGame(); }
        for(let [type, src] of Object.entries(textureFiles)) {
            let img = new Image();
            img.onload = onTexLoad;
            img.src = src;
            textures[type] = img;
        }
        
        function startGame() {
            playerX = 200;
            playerY = 120;
            velocityY = 0;
            onGround = true;
            gameLoop();
        }
        
        function gameLoop() {
            let now = performance.now();
            if(lastTime) {
                let delta = Math.min(0.033, (now-lastTime)/1000);
                update(delta);
                draw();
            }
            lastTime = now;
            requestAnimationFrame(gameLoop);
        }
        
        let lastTime = 0;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }
        
        // UI и события
        window.onload = () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resize();
            window.addEventListener('resize', resize);
            
            canvas.addEventListener('mousemove', (e) => {
                let rect = canvas.getBoundingClientRect();
                let sx = canvas.width/rect.width;
                let sy = canvas.height/rect.height;
                lastMouse = { x: (e.clientX-rect.left)*sx, y: (e.clientY-rect.top)*sy };
                draw();
            });
            canvas.addEventListener('mousedown', (e) => {
                let mx = lastMouse.x + cameraX;
                let my = lastMouse.y + cameraY;
                if(e.button===0) breakBlockAt(Math.floor(mx/TILE_SIZE), Math.floor(my/TILE_SIZE));
                if(e.button===2) placeBlockAt(Math.floor(mx/TILE_SIZE), Math.floor(my/TILE_SIZE));
                e.preventDefault();
                draw();
            });
            canvas.addEventListener('contextmenu', e=>e.preventDefault());
            
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if(e.code==='Digit1') selectedSlot=0;
                if(e.code==='Digit2') selectedSlot=1;
                if(e.code==='Digit3') selectedSlot=2;
                if(e.code==='Digit4') selectedSlot=3;
                if(e.code==='Digit5') selectedSlot=4;
                if(e.code==='Space') e.preventDefault();
                updateHotbarUI();
            });
            window.addEventListener('keyup', (e) => keys[e.code]=false);
            
            document.getElementById('skinUploadBtn').onclick = () => document.getElementById('skinFileInput').click();
            document.getElementById('skinFileInput').onchange = (e) => { if(e.target.files[0]) loadSkin(e.target.files[0]); };
            
            function updateHotbarUI() {
                let container = document.getElementById('hotbarContainer');
                container.innerHTML = '';
                inventory.forEach((item, idx) => {
                    let div = document.createElement('div');
                    div.className = `slot ${selectedSlot===idx?'selected':''}`;
                    let img = document.createElement('img');
                    img.src = textureFiles[item.type];
                    img.style.width='48px';
                    let span = document.createElement('span');
                    span.innerText = item.count;
                    div.appendChild(img); div.appendChild(span);
                    div.onclick = () => { selectedSlot=idx; updateHotbarUI(); draw(); };
                    container.appendChild(div);
                });
            }
            updateHotbarUI();
        };
    })();
</script>
</body>
</html>
